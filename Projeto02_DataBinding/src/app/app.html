<main>
  <h1>Projeto 02: Data Binding</h1>

  <p>O valor atual é: <strong>{{ contador() }}</strong></p> <!--Interpolação, variável contador exibi dados no html-->

  <button (click)="incrementar()">Aumentar</button>
  <!--Event Binding, cada vez que o botão for clicado, a função incrementar será chamada-->
  <button (click)="decrementar()">Diminuir</button>
  <!--Event Binding, cada vez que o botão for clicado, a função decrementar será chamada-->

  <hr>

  <button [disabled]="contador() < 1" (click)="contador.set(0)">Zerar Contador</button>
  <!--Property Binding, o botão será desabilitado se o contador for menor que 1-->
</main>

<!--
    Interpolação: {{ variavel }}
    Event Binding: (evento)="funcao()"
    Property Binding: [propriedade]="valor"
-->

<!--
    Sinais: 
    - São usados para gerenciar o estado da aplicação
    - São reativos, ou seja, quando o valor de um sinal muda, o Angular atualiza automaticamente o HTML
    - São criados com a função signal() do Angular
    - São acessados com a função signal() do Angular
    - São atualizados com a função update() do Angular
    - São zerados com a função set() do Angular
-->

<!--
    Sintaxe: 
    - signal(valorInicial)
    - signal.update(funcao)
    - signal.set(valor)
-->

<!--Property Binding, o botão desabilita quando "O valor atual é: 0"-->
