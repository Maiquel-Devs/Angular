<div class="card">
  <h2>📝 Novo Cadastro</h2>
  <p class="subtitle">Preencha os dados para persistir no Banco de Dados.</p>

  <div class="form-group">
    <label>Nome do Produto:</label>
    <input type="text" placeholder="Ex: Notebook Dell">
  </div>

  <div class="form-group">
    <label>Preço (R$):</label>
    <input type="number" placeholder="0.00">
  </div>

  <button class="btn-salvar" (click)="salvar()">Gravar no Sistema</button>
  
  <p class="info-status">{{ statusMensagem() }}</p>
</div>
